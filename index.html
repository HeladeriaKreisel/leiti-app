    async function sbRest(path, options = {}) {
      const url = `${SUPABASE_URL}/rest/v1/${path}`;
      const headers = {
        'apikey': SUPABASE_ANON_KEY,
        'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
        'Content-Type': 'application/json',
        'Prefer': options.prefer || 'return=representation',
        ...(options.headers || {})
      };

      const response = await fetch(url, {
        method: options.method || 'GET',
        headers,
        body: options.body ? JSON.stringify(options.body) : undefined
      });

      const text = await response.text();
      let data = null;
      try {
        data = text ? JSON.parse(text) : null;
      } catch (e) {
        data = text;
      }

      if (!response.ok) {
        const msg = (data && (data.message || data.details || data.hint)) || `HTTP ${response.status}`;
        throw new Error(msg);
      }

      return data;
    }

    // ============================================================================
    // MODELO DE CLASES POO (ACORDE AL DIAGRAMA DE CLASES UML EN src/models/)
    // ============================================================================
    class Finca {
      constructor(data = {}) {
        Object.assign(this, data);
        this.capacidad_tanque_litros = Number(data.capacidad_tanque_litros ?? 500);
        this.meta_diaria_litros = Number(data.meta_diaria_litros ?? 150);
        this.vacas_en_ordeno = Number(data.vacas_en_ordeno ?? 28);
      }
      calcularPorcentajeOcupacionTanque(litrosActuales) {
        return this.capacidad_tanque_litros > 0
          ? Math.min(100, Math.round((Number(litrosActuales) / this.capacidad_tanque_litros) * 100))
          : 0;
      }
      calcularCumplimientoMeta(litrosDia) {
        return this.meta_diaria_litros > 0
          ? Math.min(100, Math.round((Number(litrosDia) / this.meta_diaria_litros) * 100))
          : 0;
      }
    }

    class Cliente {
      constructor(data = {}) {
        Object.assign(this, data);
        this.precio_acordado_litro = Number(data.precio_acordado_litro ?? 2200);
      }
      normalizarWhatsApp(telefono) {
        const digits = String(telefono || this.telefono || '').replace(/\D/g, '');
        return digits.startsWith('57') ? digits : `57${digits}`;
      }
    }

    class RegistroLeche {
      constructor(data = {}) {
        Object.assign(this, data);
        this.litros = Number(data.litros ?? 0);
        this.precio_litro = Number(data.precio_litro ?? 2200);
        this.flete_por_litro = Number(data.flete_por_litro ?? 50);
      }
      calcularSubtotal() { return this.litros * this.precio_litro; }
      calcularDescuentoFlete() { return this.litros * this.flete_por_litro; }
      calcularNeto() { return this.calcularSubtotal() - this.calcularDescuentoFlete(); }
    }

    class VentaRemision {
      constructor(data = {}) {
        Object.assign(this, data);
        this.litros = Number(data.litros ?? 0);
        this.precio_litro = Number(data.precio_litro ?? 2200);
      }
      calcularTotal() { return this.litros * this.precio_litro; }
      alternarEstadoPago() {
        this.estado = this.estado === 'paid' ? 'pending' : 'paid';
        return this.estado;
      }
    }

    // ==============================================================
    // MODAL: CREAR / EDITAR CLIENTE EN SUPABASE
    // ==============================================================
    function ClienteModal({ isOpen, onClose, onSaved, initialData }) {
      const [nombre, setNombre] = useState('');
      const [empresa, setEmpresa] = useState('');
      const [contacto, setContacto] = useState('');
      const [telefono, setTelefono] = useState('');
      const [precio, setPrecio] = useState(2200);
      const [ruta, setRuta] = useState('Ruta Principal');
      const [saving, setSaving] = useState(false);

      useEffect(() => {
        if (initialData) {
          setNombre(initialData.nombre || '');
          setEmpresa(initialData.empresa || '');
          setContacto(initialData.contacto_nombre || '');
          setTelefono(initialData.telefono || '');
          setPrecio(initialData.precio_acordado_litro || 2200);
          setRuta(initialData.ruta || 'Ruta Principal');
        } else {
          setNombre('');
          setEmpresa('');
          setContacto('');
          setTelefono('+57 300 ');
          setPrecio(2200);
          setRuta('Ruta Principal');
        }
      }, [initialData, isOpen]);

      if (!isOpen) return null;

      const handleSubmit = async (e) => {
        e.preventDefault();
        if (!nombre.trim()) return;
        setSaving(true);
        try {
          const cleanWa = telefono.replace(/[^0-9]/g, '');
          const alias = initialData?.clave_alias || (nombre.toLowerCase().replace(/[^a-z0-9]+/g, '_').slice(0, 25) + '_' + Math.floor(100 + Math.random() * 900));

          const payload = {
            clave_alias: alias,
            nombre: nombre.trim(),
            empresa: empresa.trim() || nombre.trim(),
            contacto_nombre: contacto.trim() || nombre.trim(),
            telefono: telefono.trim(),
            telefono_wa: cleanWa || '573000000000',
            precio_acordado_litro: Number(precio) || 2200,
            ruta: ruta.trim() || 'Ruta Principal',
            activo: true
          };

          let result;
          if (initialData?.id) {
            result = await sbRest(`clientes?id=eq.${initialData.id}`, {
              method: 'PATCH',
              body: payload
            });
          } else {
            result = await sbRest('clientes', {
              method: 'POST',
              body: payload
            });
          }

          const savedRow = Array.isArray(result) ? result[0] : result;
          onSaved(savedRow, Boolean(initialData?.id));
          onClose();
        } catch (err) {
          alert('Error guardando cliente en Supabase: ' + err.message);
        } finally {
          setSaving(false);
        }
      };

      return (
        <div className="fixed inset-0 z-50 bg-black/50 backdrop-blur-xs flex items-center justify-center p-4">
          <form onSubmit={handleSubmit} className="bg-surface-container-lowest p-space-2xl rounded-2xl shadow-2xl max-w-lg w-full flex flex-col gap-space-md border border-outline-variant/30">
            <div className="flex items-center justify-between border-b border-surface-container-low pb-3">
              <div className="flex items-center gap-2">
                <span className="material-symbols-outlined text-primary">person_add</span>
                <h3 className="font-extrabold text-[18px] text-on-surface">
                  {initialData?.id ? 'Editar Cliente en Supabase' : 'Nuevo Cliente / Comprador'}
                </h3>
              </div>
              <button type="button" onClick={onClose} className="p-1 hover:bg-surface-container-low rounded-lg">
                <span className="material-symbols-outlined">close</span>
              </button>
            </div>

            <div className="grid grid-cols-1 sm:grid-cols-2 gap-space-md">
              <div className="sm:col-span-2">
                <label className="font-bold text-[12px] block mb-1">Nombre del Cliente / Planta Lechera *</label>
                <input
                  type="text"
                  required
                  placeholder="Ej: Lácteos El Trébol (Ruta Sur)"
                  value={nombre}
                  onChange={e => setNombre(e.target.value)}
                  className="w-full h-11 bg-surface-container-low px-3 rounded-xl font-semibold text-[14px]"
                />
              </div>

              <div>
                <label className="font-bold text-[12px] block mb-1">Persona de Contacto</label>
                <input
                  type="text"
                  placeholder="Ej: Don Roberto Gómez"
                  value={contacto}
                  onChange={e => setContacto(e.target.value)}
                  className="w-full h-11 bg-surface-container-low px-3 rounded-xl text-[14px]"
                />
              </div>

              <div>
                <label className="font-bold text-[12px] block mb-1">Teléfono / WhatsApp *</label>
                <input
                  type="text"
                  required
                  placeholder="Ej: +57 310 555 1234"
                  value={telefono}
                  onChange={e => setTelefono(e.target.value)}
                  className="w-full h-11 bg-surface-container-low px-3 rounded-xl text-[14px]"
                />
              </div>

              <div>
                <label className="font-bold text-[12px] block mb-1">Precio Acordado / Litro (COP) *</label>
                <input
                  type="number"
                  required
                  step="10"
                  value={precio}
                  onChange={e => setPrecio(e.target.value)}
                  className="w-full h-11 bg-surface-container-low px-3 rounded-xl font-bold text-primary text-[15px]"
                />
              </div>

              <div>
                <label className="font-bold text-[12px] block mb-1">Ruta de Recolección</label>
                <input
                  type="text"
                  placeholder="Ej: Ruta Norte"
                  value={ruta}
                  onChange={e => setRuta(e.target.value)}
                  className="w-full h-11 bg-surface-container-low px-3 rounded-xl text-[14px]"
                />
              </div>
            </div>

            <div className="flex justify-end gap-2 pt-3 border-t border-surface-container-low">
              <button
                type="button"
                onClick={onClose}
                className="px-4 py-2.5 bg-surface-container-low rounded-xl font-bold text-[13px]"

              <button

              >
                {saving ? 'Guardando en Supabase...' : 'Guardar Cliente en Supabase'}
              </button>
            </div>
          </form>
        </div>
      );
    }

    // VISTA 2: LECHE DEL DÍA (TABLA: registros_leche)
    // ==============================================================
    function LecheDiaView({ finca, registros, onAddRegistro, onDeleteRegistro }) {
      const [liters, setLiters] = useState(150);
      const [price, setPrice] = useState(finca?.precio_sugerido_litro || 2200);
      const [fleteRate, setFleteRate] = useState(50);
      const [shift, setShift] = useState('morning');
      const [operador, setOperador] = useState('Hernán Gómez');
      const [lote, setLote] = useState('Lote 1');
      const [saving, setSaving] = useState(false);

      const subtotal = (Number(liters) || 0) * (Number(price) || 0);
      const flete = (Number(liters) || 0) * (Number(fleteRate) || 0);
      const neto = subtotal - flete;

      const handleSubmit = async (e) => {
        e.preventDefault();
        if (!liters || Number(liters) <= 0) return;
        setSaving(true);
        try {
          await onAddRegistro({
            finca_id: finca?.id || 'a1b2c3d4-e5f6-7890-1234-567890abcdef',
            fecha: new Date().toISOString().split('T')[0],
            hora: new Date().toTimeString().slice(0, 8),
            turno: shift,
            litros: Number(liters),
            precio_litro: Number(price),
            flete_por_litro: Number(fleteRate) || 50,
            tanque_temperatura: Number(finca?.temperatura_tanque) || 3.4,
            operador: operador.trim() || 'Hernán Gómez',
            lote: lote.trim() || 'Lote 1'
          });
        } finally {
          setSaving(false);
        }
      };

      return (
        <div className="grid grid-cols-1 xl:grid-cols-12 gap-space-xl items-start">
          <form onSubmit={handleSubmit} className="xl:col-span-7 bg-surface-container-lowest p-space-2xl rounded-2xl shadow-sm border border-outline-variant/20 flex flex-col gap-space-xl">
            <div className="flex items-center justify-between flex-wrap gap-2">
              <div>
                <h1 className="text-[24px] font-extrabold text-on-surface">Registrar Ordeño en Supabase</h1>
                <p className="text-[14px] text-on-surface-variant">Se guarda directamente en la tabla <code>registros_leche</code>.</p>
              </div>
              <div className="flex bg-surface-container-low p-1 rounded-xl">
                <button
                  type="button"
                  onClick={() => setShift('morning')}
                  className={`px-space-md py-1.5 rounded-lg font-bold text-[13px] ${shift === 'morning' ? 'bg-surface-container-lowest text-primary shadow-xs' : 'text-on-surface-variant'}`}
                >
                  ☀️ Mañana
                </button>
                <button
                  type="button"
                  onClick={() => setShift('afternoon')}
                  className={`px-space-md py-1.5 rounded-lg font-bold text-[13px] ${shift === 'afternoon' ? 'bg-surface-container-lowest text-primary shadow-xs' : 'text-on-surface-variant'}`}
                >
                  🌅 Tarde
                </button>
              </div>
            </div>

            <div className="p-space-xl bg-surface-container-low rounded-xl flex flex-col gap-2">
              <label className="font-bold text-[14px]">Volumen Extraído de Leche (Litros)</label>
              <div className="relative">
                <input
                  type="number"
                  step="any"
                  min="1"
                  required
                  value={liters}
                  onChange={(e) => setLiters(e.target.value)}
                  className="w-full h-20 bg-surface-container-lowest text-[36px] font-extrabold pl-space-xl pr-28 rounded-xl shadow-xs"
                />
                <span className="absolute right-6 top-6 text-[18px] font-bold text-tertiary">LITROS</span>
              </div>

              <div className="flex gap-2 pt-2 flex-wrap">
                <button type="button" onClick={() => setLiters(l => (Number(l) || 0) + 10)} className="px-3 py-1.5 bg-white rounded-lg shadow-xs text-[12px] font-bold">+10 L</button>
                <button type="button" onClick={() => setLiters(l => (Number(l) || 0) + 25)} className="px-3 py-1.5 bg-white rounded-lg shadow-xs text-[12px] font-bold">+25 L</button>
                <button type="button" onClick={() => setLiters(l => (Number(l) || 0) + 50)} className="px-3 py-1.5 bg-white rounded-lg shadow-xs text-[12px] font-bold">+50 L</button>
                <button type="button" onClick={() => setLiters(finca?.capacidad_tanque_litros || 500)} className="px-3 py-1.5 bg-secondary-container text-on-secondary-container rounded-lg font-bold text-[12px]">
                  Tanque Lleno ({finca?.capacidad_tanque_litros || 500}L)
                </button>
              </div>
            </div>

            <div className="grid grid-cols-1 sm:grid-cols-3 gap-space-md">
              <div>
                <label className="font-bold text-[13px]">Precio / Litro (COP)</label>
                <input
                  type="number"
                  value={price}
                  onChange={(e) => setPrice(e.target.value)}
                  className="w-full h-12 bg-surface-container-low px-space-md rounded-xl font-bold text-[16px] mt-1"
                />
              </div>
              <div>
                <label className="font-bold text-[13px]">Operador</label>
                <input
                  type="text"
                  value={operador}
                  onChange={(e) => setOperador(e.target.value)}
                  className="w-full h-12 bg-surface-container-low px-space-md rounded-xl font-medium mt-1"
                />
              </div>
              <div>
                <label className="font-bold text-[13px]">Lote / Potrero</label>
                <input
                  type="text"
                  value={lote}
                  onChange={(e) => setLote(e.target.value)}
                  className="w-full h-12 bg-surface-container-low px-space-md rounded-xl font-medium mt-1"
                />
              </div>
            </div>

            <div className="p-space-lg bg-surface-container-low rounded-xl flex flex-col gap-1">
              <div className="flex justify-between text-[14px]">
                <span>Subtotal Bruto:</span>
                <span className="font-bold">{formatCOP(subtotal)}</span>
              </div>
              <div className="flex justify-between text-[14px] text-error">
                <span>Deducción Flete (${fleteRate}/L):</span>
                <span>-{formatCOP(flete)}</span>
              </div>
              <div className="border-t border-surface-container-high pt-2 flex justify-between font-extrabold text-[20px] text-primary">
                <span>Neto a Liquidar:</span>
                <span>{formatCOP(neto)}</span>
              </div>
            </div>

            <button
              type="submit"
              disabled={saving}
              className="w-full py-space-lg bg-primary hover:bg-primary-container text-white font-extrabold rounded-xl shadow-md transition-all text-[16px] disabled:opacity-50"
            >
              {saving ? 'Guardando en Supabase...' : '✓ Guardar Ordeño en Supabase'}
            </button>
          </form>

          {/* Historial en vivo desde Supabase */}
          <div className="xl:col-span-5 bg-surface-container-lowest p-space-2xl rounded-2xl shadow-sm border border-outline-variant/20 flex flex-col gap-space-md">
            <div className="flex items-center justify-between">
              <h3 className="text-[18px] font-extrabold text-on-surface">
                Ordeños en Supabase ({registros.length})
              </h3>
              <span className="text-[11px] font-mono bg-secondary-container text-on-secondary-container px-2 py-0.5 rounded-md font-bold">
                public.registros_leche
              </span>
            </div>
            <div className="divide-y divide-surface-container-low max-h-[540px] overflow-y-auto">
              {registros.map(r => (
                <div key={r.id} className="py-space-md flex justify-between items-center gap-2">
                  <div>
                    <span className="font-bold text-[14px] text-on-surface block">
                      {r.turno === 'morning' ? '☀️ Mañana' : '🌅 Tarde'} • {r.litros} Litros
                    </span>
                    <span className="text-[12px] text-tertiary">
                      {r.fecha} ({String(r.hora || '').slice(0, 5)}) • {r.operador} • {r.lote || 'Lote 1'}
                    </span>
                  </div>
                  <div className="flex items-center gap-2">
                    <span className="font-bold text-primary text-[14px]">
                      {formatCOP(r.neto_cop || r.subtotal_cop || r.litros * r.precio_litro)}
                    </span>
                    <button
                      type="button"
                      onClick={() => onDeleteRegistro(r.id)}
                      title="Eliminar registro de Supabase"
                      className="p-1.5 text-tertiary hover:text-error hover:bg-error-container/40 rounded-lg transition-colors"
                    >
                      <span className="material-symbols-outlined text-[18px]">delete</span>
                    </button>
                  </div>
                </div>
              ))}
            </div>
          </div>
        </div>
      );
    }

      useEffect(() => {
        if (clientes.length > 0 && !selectedClienteId) {
          const first = clientes[0];
          setSelectedClienteId(first.id || first.clave_alias);

        telefono_wa: '573000000000',

          await onAddVenta({
            numero_remision: numRem,

            conductor_nombre: conductor.trim() || buyer.contacto_nombre || 'Conductor',

          </form>

          {/* Lista de remisiones en Supabase */}
          <div className="xl:col-span-7 bg-surface-container-lowest p-space-2xl rounded-2xl shadow-sm border border-outline-variant/20 flex flex-col gap-space-md">

                public.ventas_remisiones
              </span>
            </div>
            <div className="divide-y divide-surface-container-low max-h-[540px] overflow-y-auto">
              {ventas.map(v => (
                <div key={v.id} className="py-space-md flex justify-between items-center gap-3">
                  <div>
                    <span className="font-bold text-[14px] text-on-surface block">
                      {v.numero_remision} • {v.cliente_nombre}
                    </span>
                    <span className="text-[12px] text-tertiary">
                      {v.fecha} • {v.litros} Litros a ${v.precio_litro}/L • {v.conductor_nombre || 'Ruta'} ({v.placa_vehiculo || 'TRK'})
                    </span>
                  </div>
                  <div className="flex items-center gap-3">
                    <div className="text-right">
                      <span className="font-extrabold text-primary block text-[15px]">{formatCOP(v.total_cop)}</span>
                      <button

    // ==============================================================
    // APP PRINCIPAL CONECTADA EN VIVO A SUPABASE
    // ==============================================================
    function MainApp() {
      const [currentTab, setCurrentTab] = useState('inicio');
      const [finca, setFinca] = useState({
        id: 'a1b2c3d4-e5f6-7890-1234-567890abcdef',
        nombre_finca: 'Hacienda La Pradera',
        propietario_nombre: 'TOMAS GARCIA',
        propietario_cedula: 'CC 71.492.308-4',
        telefono: '+57 312 489 9012',
        email: 'carlos.mendoza@lapradera.co',
        municipio: 'San Pedro de los Milagros',
        departamento: 'Antioquia',
        sector: 'Sector El Salitre',
        codigo_ica: 'ICA Res. 04892',
        id_predial: 'COL-ANT-88210',
        capacidad_tanque_litros: 500,
        temperatura_tanque: 3.8,
        total_vacas: 45,
        vacas_en_ordeno: 28,
        precio_sugerido_litro: 2200
      });
      const [registros, setRegistros] = useState([]);
      const [clientes, setClientes] = useState([]);
      const [ventas, setVentas] = useState([]);
      const [toast, setToast] = useState({ visible: false, title: '', message: '', type: 'success' });
      const [isSyncing, setIsSyncing] = useState(false);
      const [connStatus, setConnStatus] = useState({ ok: false, message: 'Conectando con Supabase PostgreSQL...' });
      const [lastSync, setLastSync] = useState('');

      // Modal de cliente
      const [clienteModalOpen, setClienteModalOpen] = useState(false);
      const [editingCliente, setEditingCliente] = useState(null);

      const showToast = useCallback((title, message, type = 'success') => {
        setToast({ visible: true, title, message, type });
        setTimeout(() => setToast(prev => ({ ...prev, visible: false })), 4000);
      }, []);

      const loadFromSupabase = useCallback(async () => {
        setIsSyncing(true);
        try {
          const [fincasData, clientesData, registrosData, ventasData] = await Promise.all([
            sbRest('fincas?select=*&limit=1'),
            sbRest('clientes?select=*&order=created_at.asc'),
            sbRest('registros_leche?select=*&order=created_at.desc'),
            sbRest('ventas_remisiones?select=*&order=created_at.desc')
          ]);

          if (Array.isArray(fincasData) && fincasData[0]) setFinca(fincasData[0]);
          if (Array.isArray(clientesData)) setClientes(clientesData);
          if (Array.isArray(registrosData)) setRegistros(registrosData);
          if (Array.isArray(ventasData)) setVentas(ventasData);

          const nowStr = new Date().toLocaleTimeString('es-CO', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
          setLastSync(nowStr);
          setConnStatus({
            ok: true,
            message: `Conectado en vivo a Supabase (cthvxtjwstyezwzuohdx) • ${clientesData.length} clientes, ${registrosData.length} ordeños, ${ventasData.length} ventas`
          });
        } catch (err) {
          console.error('Error sincronizando con Supabase:', err);
          setConnStatus({
            ok: false,
            message: `Error de conexión con Supabase: ${err.message}`
          });
          showToast('Error Supabase', err.message, 'error');
        } finally {
          setIsSyncing(false);
        }
      }, [showToast]);

      useEffect(() => {
        loadFromSupabase();
      }, [loadFromSupabase]);

      // Guardar ordeño en Supabase
      const handleAddRegistro = async (reg) => {
        try {
          const inserted = await sbRest('registros_leche', {
            method: 'POST',
            body: reg
          });
          const row = Array.isArray(inserted) ? inserted[0] : inserted;
          setRegistros(prev => [row, ...prev]);
          showToast('Ordeño Guardado en Supabase', `Se registraron ${reg.litros} L en public.registros_leche.`);
        } catch (err) {
          showToast('Error al guardar ordeño', err.message, 'error');
        }
      };

      const handleDeleteRegistro = async (id) => {
        try {
          await sbRest(`registros_leche?id=eq.${id}`, { method: 'DELETE' });
          setRegistros(prev => prev.filter(r => r.id !== id));
          showToast('Ordeño Eliminado', 'El registro fue eliminado de Supabase.');
        } catch (err) {
          showToast('Error al eliminar', err.message, 'error');
        }
      };

      // Guardar ficha de finca en Supabase
      const handleSaveFinca = async (data) => {
        try {
          const payload = {
            nombre_finca: data.nombre_finca,
            propietario_nombre: data.propietario_nombre,
            propietario_cedula: data.propietario_cedula,
            telefono: data.telefono,
            email: data.email,
            municipio: data.municipio,
            sector: data.sector,
            codigo_ica: data.codigo_ica,
            capacidad_tanque_litros: Number(data.capacidad_tanque_litros) || 500,
            total_vacas: parseInt(data.total_vacas) || 45,
            vacas_en_ordeno: parseInt(data.vacas_en_ordeno) || 28,
            precio_sugerido_litro: Number(data.precio_sugerido_litro) || 2200,
            updated_at: new Date().toISOString()
          };
          const updated = await sbRest(`fincas?id=eq.${data.id || 'a1b2c3d4-e5f6-7890-1234-567890abcdef'}`, {
            method: 'PATCH',
            body: payload
          });
          if (Array.isArray(updated) && updated[0]) {
            setFinca(updated[0]);
          } else {
            setFinca(prev => ({ ...prev, ...payload }));
          }
          showToast('Finca Actualizada en Supabase', 'Los datos quedaron guardados en public.fincas.');
        } catch (err) {
          showToast('Error guardando finca', err.message, 'error');
        }
      };

      // Emitir remisión en Supabase
      const handleAddVenta = async (vnt) => {
        try {
          const inserted = await sbRest('ventas_remisiones', {
            method: 'POST',
            body: vnt
          });
          const row = Array.isArray(inserted) ? inserted[0] : inserted;
          setVentas(prev => [row, ...prev]);
          showToast('Remisión Guardada en Supabase', `Remisión ${vnt.numero_remision} creada en public.ventas_remisiones.`);
        } catch (err) {
          showToast('Error creando remisión', err.message, 'error');
        }
      };

      const handleToggleEstadoVenta = async (id, nuevoEstado) => {
        try {
          const updated = await sbRest(`ventas_remisiones?id=eq.${id}`, {
            method: 'PATCH',
            body: { estado: nuevoEstado, updated_at: new Date().toISOString() }
          });
          const row = Array.isArray(updated) ? updated[0] : null;
          setVentas(prev => prev.map(v => v.id === id ? (row || { ...v, estado: nuevoEstado }) : v));
          showToast('Estado Actualizado', `Remisión marcada como ${nuevoEstado === 'paid' ? 'Pagada' : 'Pendiente'} en Supabase.`);
        } catch (err) {
          showToast('Error actualizando estado', err.message, 'error');
        }
      };

      const handleDeleteVenta = async (id) => {
        try {
          await sbRest(`ventas_remisiones?id=eq.${id}`, { method: 'DELETE' });
          setVentas(prev => prev.filter(v => v.id !== id));
          showToast('Remisión Eliminada', 'Se eliminó de public.ventas_remisiones.');
        } catch (err) {
          showToast('Error eliminando remisión', err.message, 'error');
        }
      };

      // Clientes CRUD
      const handleClienteSaved = (savedRow, isEdit) => {
        if (isEdit) {
          setClientes(prev => prev.map(c => c.id === savedRow.id ? savedRow : c));
          showToast('Cliente Actualizado', `${savedRow.nombre} actualizado en Supabase.`);
        } else {
          setClientes(prev => [...prev, savedRow]);
          showToast('Cliente Creado en Supabase', `${savedRow.nombre} agregado a public.clientes.`);
        }
      };

      const handleDeleteCliente = async (id) => {
        if (!id) return;
        try {
          await sbRest(`clientes?id=eq.${id}`, { method: 'DELETE' });
          setClientes(prev => prev.filter(c => c.id !== id));
          showToast('Cliente Eliminado', 'Se eliminó de public.clientes en Supabase.');
        } catch (err) {
          showToast('Error eliminando cliente', err.message, 'error');
        }
      };

      return (
        <div className="bg-background min-h-screen text-on-surface antialiased">
          <Sidebar
            currentTab={currentTab}
            setCurrentTab={setCurrentTab}
            finca={finca}
            connOk={connStatus.ok}
            stats={{
              registros: registros.length,
              ventas: ventas.length,
              clientes: clientes.length
            }}
          />
          <div className="pl-72 min-h-screen flex flex-col">
            <Header
              onSync={loadFromSupabase}
              isSyncing={isSyncing}
              lastSync={lastSync}
            />
            <main className="pt-24 px-space-2xl py-space-xl flex-1 max-w-[1600px] mx-auto w-full flex flex-col gap-space-lg">
              {/* Barra de Estado de Conexión en Vivo con Supabase */}
              <div className={`px-space-lg py-space-sm rounded-xl flex items-center justify-between border ${
                connStatus.ok
                  ? 'bg-secondary-container/40 border-primary/30 text-on-surface'
                  : 'bg-error-container/50 border-error/40 text-on-error-container'
              }`}>
                <div className="flex items-center gap-space-sm">
                  <span className={`material-symbols-outlined text-[20px] ${connStatus.ok ? 'text-primary' : 'text-error'}`}>
                    {connStatus.ok ? 'cloud_done' : 'cloud_off'}
                  </span>
                  <span className="font-bold text-[13px]">{connStatus.message}</span>
                </div>
                <button
                  type="button"
                  onClick={() => { setEditingCliente(null); setClienteModalOpen(true); }}
                  className="px-3 py-1 bg-primary text-white rounded-lg font-bold text-[12px] shadow-xs hover:bg-primary-container transition-all"
                >
                  + Agregar Cliente
                </button>
              </div>

              {currentTab === 'inicio' && (
                <DashboardView
                  finca={finca}
                  registros={registros}
                  ventas={ventas}
                  clientes={clientes}
                  onNavigate={setCurrentTab}
                />
              )}
              {currentTab === 'leche-del-dia' && (
                <LecheDiaView
                  finca={finca}
                  registros={registros}
                  onAddRegistro={handleAddRegistro}
                  onDeleteRegistro={handleDeleteRegistro}
                />
              )}
              {currentTab === 'mi-finca' && (
                <MiFincaView
                  finca={finca}
                  onSaveFinca={handleSaveFinca}
                />
              )}
              {currentTab === 'ventas' && (
                <VentasView
                  clientes={clientes}
                  ventas={ventas}
                  onAddVenta={handleAddVenta}
                  onToggleEstadoVenta={handleToggleEstadoVenta}
                  onDeleteVenta={handleDeleteVenta}
                  onOpenNewCliente={() => { setEditingCliente(null); setClienteModalOpen(true); }}
                />
              )}
              {currentTab === 'clientes' && (
                <ClientesView
                  clientes={clientes}
                  onOpenNewCliente={() => { setEditingCliente(null); setClienteModalOpen(true); }}
                  onEditCliente={(c) => { setEditingCliente(c); setClienteModalOpen(true); }}
                  onDeleteCliente={handleDeleteCliente}
                />
              )}
            </main>
          </div>

          <ClienteModal
            isOpen={clienteModalOpen}
            onClose={() => setClienteModalOpen(false)}
            initialData={editingCliente}
            onSaved={handleClienteSaved}
          />

          <ToastNotification
            toast={toast}
            onClose={() => setToast(prev => ({ ...prev, visible: false }))}
          />
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<MainApp />);
  </script>
</body>
</html>
